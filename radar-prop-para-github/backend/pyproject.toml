[tool.ruff]
line-length = 140
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# copia textual de las reglas de El Ojo de Dios: no se reformatea para poder compararla con la app vieja
"app/scraper/texto.py" = ["E501"]
"app/scraper/bbp.py" = ["E501"]
"app/scraper/ibb.py" = ["E501"]
"app/scraper/credito.py" = ["E501", "E741"]
"app/services/catalogo.py" = ["E501"]
"app/services/fichas_formato.py" = ["E501", "E731"]
"tests/test_propiedades.py" = ["E501"]
"app/services/sectores/*.py" = ["E501", "E731", "E741", "B023", "B007"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
