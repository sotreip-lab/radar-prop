# Render (plan gratis) apaga el servidor si nadie lo usa por 15 minutos y la primera consulta tarda casi un minuto.
# Esto lo consulta cada 10 minutos para que esté siempre despierto. No usa ninguna clave.
name: Mantener despierto el servidor
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
permissions: {}
jobs:
  despertar:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: curl -fsS --retry 3 --retry-delay 20 --max-time 90 https://radar-prop-api.onrender.com/health
