# Respaldo diario de la base, cifrado con AES-256. Queda 30 días en Actions → Respaldo diario → Artifacts.
# Necesita los secretos DATABASE_URL y BACKUP_CLAVE. Sin BACKUP_CLAVE no se puede abrir el respaldo: guardala.
# También mantiene activas las tareas programadas (GitHub las apaga si el repositorio pasa 60 días sin cambios).
name: Respaldo diario
on:
  schedule:
    - cron: "17 6 * * *"   # 03:17 en Bahía Blanca
  workflow_dispatch:
permissions:
  contents: read
  actions: write
jobs:
  respaldo:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Revisar secretos
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BACKUP_CLAVE: ${{ secrets.BACKUP_CLAVE }}
        run: |
          [ -n "$DATABASE_URL" ] || { echo "::error::Falta el secreto DATABASE_URL"; exit 1; }
          [ ${#BACKUP_CLAVE} -ge 20 ] || { echo "::error::Falta el secreto BACKUP_CLAVE (mínimo 20 caracteres)"; exit 1; }
      - name: Instalar pg_dump de la misma versión que la base
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          pip install --quiet "psycopg[binary]"
          URL=$(python -c "import os,re;print(re.sub(r'^postgres(ql)?(\+\w+)?://','postgresql://',os.environ['DATABASE_URL'].strip()))")
          echo "::add-mask::$URL"
          echo "PGURL=$URL" >> "$GITHUB_ENV"
          MAYOR=$(PGURL="$URL" python -c "import os,psycopg;print(psycopg.connect(os.environ['PGURL']).info.server_version//10000)")
          echo "Base PostgreSQL $MAYOR"
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSo /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -qq && sudo apt-get install -y -qq "postgresql-client-$MAYOR" > /dev/null
          echo "PGBIN=/usr/lib/postgresql/$MAYOR/bin" >> "$GITHUB_ENV"
      - name: Respaldar, verificar y cifrar
        env:
          BACKUP_CLAVE: ${{ secrets.BACKUP_CLAVE }}
        run: |
          set -euo pipefail
          F="radar-prop-$(TZ=America/Argentina/Buenos_Aires date +%Y-%m-%d)"
          "$PGBIN/pg_dump" "$PGURL" --schema=public --no-owner --no-privileges -Fc -f "$F.dump"
          TABLAS=$("$PGBIN/pg_restore" -l "$F.dump" | grep -c "TABLE DATA")
          echo "Respaldo: $(du -h "$F.dump" | cut -f1), $TABLAS tablas con datos"
          [ "$TABLAS" -ge 10 ] || { echo "::error::El respaldo salió incompleto"; exit 1; }
          gpg --batch --yes --pinentry-mode loopback --passphrase "$BACKUP_CLAVE" --symmetric --cipher-algo AES256 -o "$F.dump.gpg" "$F.dump"
          shred -u "$F.dump"
          echo "ARCHIVO=$F.dump.gpg" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARCHIVO }}
          path: ${{ env.ARCHIVO }}
          retention-days: 30
          compression-level: 0
      - name: Mantener activas las tareas programadas
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for w in actualizar.yml respaldo.yml; do
            gh api -X PUT "repos/${{ github.repository }}/actions/workflows/$w/enable" && echo "$w activa"
          done
