# Fase 6: arma la APK de Android (Capacitor: visor propio, sin Chrome) y el instalador de Windows y los publica en
# https://github.com/sotreip-lab/radar-prop/releases/latest (siempre el mismo enlace).
# Se lanza a mano (Actions → Apps → Run workflow) o solo cuando cambia algo en radar-prop-para-github/apps.
# Las apps abren la web, así que NO hace falta volver a armarlas cuando se actualiza la web.
name: Apps
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["radar-prop-para-github/apps/**", ".github/workflows/apps.yml"]
permissions:
  contents: write
concurrency:
  group: apps
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: radar-prop-para-github/apps/movil
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Proyecto Android (Capacitor)
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npx cap add android
          pip install --quiet pillow
          python recursos.py
          npx cap sync android
      - name: Armar y firmar la APK
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
        run: |
          set -euo pipefail
          [ -n "$ANDROID_KEYSTORE_B64" ] || { echo "::error::Falta el secreto ANDROID_KEYSTORE_B64"; exit 1; }
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          KS="$RUNNER_TEMP/radarprop.p12"
          echo "$ANDROID_KEYSTORE_B64" | base64 -d > "$KS"
          "$BT/zipalign" -p -f 4 app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/alineada.apk"
          "$BT/apksigner" sign --ks "$KS" --ks-type PKCS12 --ks-pass env:KS_PASS --ks-key-alias radarprop \
            --out "$RUNNER_TEMP/RadarProp.apk" "$RUNNER_TEMP/alineada.apk"
          "$BT/apksigner" verify --print-certs "$RUNNER_TEMP/RadarProp.apk" | grep -i "SHA-256"
          rm -f "$KS"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: ${{ runner.temp }}/RadarProp.apk

  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: radar-prop-para-github/apps/windows
    steps:
      - uses: actions/checkout@v4
      - name: Armar instalador
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc "/DVersion=1.0.${{ github.run_number }}" radarprop.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: radar-prop-para-github/apps/windows/Output/RadarProp-Instalador.exe

  publicar:
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: apps
          merge-multiple: true
      - name: Publicar en Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          R="${{ github.repository }}"
          TAG="apps-v${{ github.run_number }}"
          gh release create "$TAG" apps/RadarProp.apk apps/RadarProp-Instalador.exe --repo "$R" --latest \
            --title "Radar Prop — apps (versión ${{ github.run_number }})" \
            --notes "Android: descargá **RadarProp.apk** desde el celular y abrila (si pide permiso para instalar apps de otras fuentes, aceptalo).
          Windows: descargá **RadarProp-Instalador.exe** y abrilo. Si aparece *Windows protegió su PC*, tocá *Más información* → *Ejecutar de todas formas*.
          Las dos abren https://radar-prop.netlify.app, así que siempre muestran la última versión de la app."
